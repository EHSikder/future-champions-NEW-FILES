services:
  - type: web
    name: future-champions-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Fill these in Render Dashboard → Environment tab
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: THESPORTSDB_API_KEY
        sync: false
      - key: THESPORTSDB_BASE_URL
        value: https://www.thesportsdb.com/api/v2/json
      - key: THESPORTSDB_LEAGUE_ID
        sync: false
      - key: THESPORTSDB_SEASON
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

